name: sprout-plant-care
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sprout
      POSTGRES_USER: sprout
      POSTGRES_PASSWORD: sprout-local-only
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - sprout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprout -d sprout"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sprout-postgres:
